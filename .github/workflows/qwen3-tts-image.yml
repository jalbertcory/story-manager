name: Qwen3-TTS image

on:
  push:
    branches:
      - main
    paths:
      - services/qwen3_tts/**
      - services/omnivoice/audio_quality.py
      - services/speaker_similarity.py
      - services/tts_consistency.py
      - services/voice_roster.py
      - services/__init__.py
      - services/service_auth.py
      - .github/workflows/qwen3-tts-image.yml
  # PR builds paused to conserve Actions minutes; main publishing stays enabled.
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - services/qwen3_tts/**
  #     - services/omnivoice/audio_quality.py
  #     - services/speaker_similarity.py
  #     - services/tts_consistency.py
  #     - services/voice_roster.py
  #     - services/__init__.py
  #     - services/service_auth.py
  #     - .github/workflows/qwen3-tts-image.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-qwen3-tts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=ref,event=pr

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/qwen3_tts/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qwen3-tts
          cache-to: type=gha,mode=max,scope=qwen3-tts

name: CI

# No paths-ignore: a docs-only PR still reports this check (so it can be made
# required), and every main commit gets a CI result for the publish workflow.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR pushes are cancelled. Main runs get their own group: a shared
  # group would let a newer push replace an older pending run, and that commit
  # would never get a CI result or a published image.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists pull request files through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            services/gpu_scheduler/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          npm --prefix frontend ci --no-audit --no-fund

      - name: Pre-PR checks
        run: make pr-check

      - name: Backend and frontend unit tests
        run: make test

      - name: GPU scheduler tests
        run: make test-gpu-scheduler

      # SQLite cannot show migration or row-locking behaviour, so the
      # PostgreSQL suite runs whenever the schema or the job-queue code changes.
      - name: Detect PostgreSQL-sensitive changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            postgres:
              - 'backend/alembic/**'
              - 'backend/app/models.py'
              - 'backend/app/crud/processing.py'
              - 'backend/app/services/*queue*.py'
              - 'backend/tests/*postgres*.py'
              - 'scripts/migration-*.sql'
              - 'Makefile'
              - '.github/workflows/ci.yml'

      - name: PostgreSQL migration and queue tests
        if: steps.changes.outputs.postgres == 'true' || github.event_name == 'workflow_dispatch'
        run: make test-migrations

name: E2E Tests

# The full Playwright suite runs nightly, on demand, and on pull requests that
# carry the `e2e` label. Every push still runs it locally through the pre-push hook.
on:
  schedule:
    - cron: '17 7 * * *'
  pull_request:
    branches: [ main ]
    types: [ labeled, synchronize, opened, reopened ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build e2e image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: story-manager-e2e:latest
          load: true
          cache-from: type=gha,scope=story-manager
          # Pull request runs only read the cache so they cannot evict main's layers.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=story-manager' || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Run container
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for the application to become healthy
        run: |
          timeout 300 bash -c '
            until curl --output /dev/null --silent --fail http://localhost:8000/health; do
              printf "."
              sleep 5
            done
          '

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: 'true'

      - name: Show container logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Stop container
        if: always()
        run: docker compose -f docker-compose.e2e.yml down

    "docker==7.2.0",
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[project]
name = "story-manager-omnivoice-adapter"
version = "0.1.0"
description = "Local official OmniVoice adapter for Story Manager"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "numpy==2.4.6",
    "omnivoice==0.2.1",
    # Text normalization (numbers, dates, currency) needs WeTextProcessing, whose
    # pynini dependency only publishes Linux x86_64 wheels.
    "omnivoice[tn]==0.2.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pydub==0.25.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers>=4.57,<6",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false
constraint-dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

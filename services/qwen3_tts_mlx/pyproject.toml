[project]
name = "story-manager-qwen3-tts-mlx-adapter"
version = "0.1.0"
description = "Apple-Silicon MLX Qwen3-TTS adapter for Story Manager"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "mlx-audio==0.5.8",
    "numpy>=2.4,<3",
    "pydub==0.25.1",
    "soundfile>=0.13,<1",
    "torch>=2.8,<3",
    "transformers>=5.15,<6",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[project]
name = "story-manager"
version = "0.1.0"
description = "A self-hosted digital library and reader for your personal collection of EPUBs and web novels."
requires-python = ">=3.14"
# Direct runtime dependencies only. Transitive packages are pinned by uv.lock.
dependencies = [
    "alembic==1.20.0",
    "apscheduler==3.11.3",
    "argon2-cffi==25.1.0",
    "beautifulsoup4==4.15.0",
    "ebooklib==0.20",
    "en-core-web-sm",
    "fanficfare==4.62.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "mutagen>=1.47,<2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "spacy>=3.8,<3.9",
    "sqlalchemy[asyncio]==2.1.4",
    "starlette==1.7.0",
    "typing-extensions==4.16.0",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.16.0",
    "flake8==7.4.1",
    "black==26.10.1",
    "autoflake==2.4.0",
    "mypy==2.4.0",
    # Imported by services/gpu_scheduler, which mypy checks from this environment.
    "httpx2==2.13.1",
    "types-requests==2.33.0.20261006",
    "types-PyYAML==6.0.12.20260906",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-docker==7.2.0.20261006",
    "lxml-stubs==0.5.1",
]

# The spaCy English model is not on PyPI. Pin the release wheel so the lockfile
# records its hash and every environment gets the same model.
[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that require network access (deselect with '-m not integration')",
    "postgres: needs STORY_MANAGER_TEST_POSTGRES_URL pointing at a migrated PostgreSQL database (skipped otherwise)",
]

[tool.setuptools]
packages = ["backend"]

# The app runs on Python 3.14, but shared modules in services/ also run on the
# 3.12/3.13 model images. Keep formatter and type-check targets at the oldest of
# those (3.12) so no newer syntax or stdlib API (e.g. unparenthesized
# `except A, B:`) leaks into them.
[tool.black]
line-length = 127
target-version = ["py312"]

[tool.flake8]
max-line-length = 127

[tool.mypy]
python_version = "3.12"
files = ["backend/app", "services"]
exclude = ["(^|/)(tests|\\.venv)/"]
strict = true
show_error_codes = true

# These upstream libraries do not publish typing metadata.
[[tool.mypy.overrides]]
module = ["ebooklib.*", "fanficfare.*", "apscheduler.*"]
ignore_missing_imports = true

# Model runtimes live in isolated service environments, not the main dev/CI
# environment. Only their imports are exempt; our adapter code is checked.
[[tool.mypy.overrides]]
module = [
    "torch.*", "transformers.*", "soundfile.*", "whisperx.*",
    "pydub.*", "qwen_tts.*", "peft.*", "omnivoice.*", "mlx.*", "mlx_audio.*",
    "onnxruntime.*", "huggingface_hub.*",
]
ignore_missing_imports = true

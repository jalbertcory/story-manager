[project]
name = "story-manager"
version = "0.1.0"
description = "A self-hosted digital library and reader for your personal collection of EPUBs and web novels."
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "apscheduler==3.11.3",
    "beautifulsoup4==4.15.0",
    "brotli==1.2.0",
    "certifi==2026.7.22",
    "chardet==7.6.0",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "cloudscraper==1.2.71",
    "ebooklib==0.20",
    "fanficfare==4.62.0",
    "fastapi==0.143.0",
    "greenlet==3.5.6",
    "h11==0.16.0",
    "html2text==2025.4.15",
    "html5lib==1.1",
    "httpcore==1.0.9",
    "httptools==0.9.0",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "mutagen>=1.47,<2",
    "idna==3.20",
    "lxml==6.1.3",
    "pydantic==2.14.1",
    "pydantic-core==2.50.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "requests-file==3.0.1",
    "requests-toolbelt==1.0.0",
    "six==1.17.0",
    "spacy>=3.7,<4",
    "sniffio==1.3.1",
    "soupsieve==3.0.1",
    "sqlalchemy==2.1.4",
    "starlette==1.7.0",
    "typing-inspection==0.4.4",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",
    "watchfiles==1.3.0",
    "webencodings==0.6.1",
    "websockets==17.2",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "iniconfig==2.3.1",
    "packaging==26.3",
    "pluggy==1.6.0",
    "pygments==2.21.0",
    "pyparsing==3.3.3",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.16.0",
    "flake8==7.4.1",
    "black==26.10.1",
    "autoflake==2.4.0",
    "mypy==2.4.0",
    "types-requests==2.33.0.20261006",
    "types-PyYAML==6.0.12.20260906",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-docker==7.2.0.20261006",
    "lxml-stubs==0.5.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that require network access (deselect with '-m not integration')",
]

[tool.setuptools]
packages = ["backend"]

# The app runs on Python 3.14, but shared modules in services/ also run on the
# 3.12/3.13 model images. Keep formatter and type-check targets at 3.13 so no
# 3.14-only syntax (e.g. unparenthesized `except A, B:`) leaks into them.
[tool.black]
line-length = 127
target-version = ["py313"]

[tool.flake8]
max-line-length = 127

[tool.mypy]
python_version = "3.13"
files = ["backend/app", "services"]
exclude = ["(^|/)(tests|\\.venv)/"]
strict = true
show_error_codes = true

# These upstream libraries do not publish typing metadata.
[[tool.mypy.overrides]]
module = ["ebooklib.*", "fanficfare.*", "apscheduler.*"]
ignore_missing_imports = true

# Model runtimes live in isolated service environments, not the main dev/CI
# environment. Only their imports are exempt; our adapter code is checked.
[[tool.mypy.overrides]]
module = [
    "torch.*", "transformers.*", "soundfile.*", "whisperx.*",
    "pydub.*", "qwen_tts.*", "peft.*", "omnivoice.*", "mlx.*", "mlx_audio.*",
]
ignore_missing_imports = true
